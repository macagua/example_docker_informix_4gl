services:
  informix:
    image: icr.io/informix/informix-developer-database
    container_name: informix_dev
    environment:
      - LICENSE=accept
      - DB_LOCALE=es_ES.utf8
      - CLIENT_LOCALE=es_ES.utf8
    ports:
      - "9088:9088"
    volumes:
      - informix_data:/opt/ibm/informix/data
      - ./sql:/opt/ibm/informix/sql  # Optional local folder for your SQL scripts
    restart: unless-stopped

volumes:
  informix_data:
